<!DOCTYPE html>
<html>
<head>
<title>Sorry Pinki 💖</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
}

body {
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background: radial-gradient(circle at center, #0b1026 0%, #16213e 50%, #000000 100%);
  transition: 1s;
  position: relative;
}

/* Stars */
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.6;
  animation: twinkle 2s infinite alternate;
  z-index: 1;
}

@keyframes twinkle {
  from {opacity: 0.3;}
  to {opacity: 1;}
}

/* Main Content */
.container {
  position: relative;
  z-index: 2;
  margin-top: 80px;
}

h1 {
  font-size: 50px;
  color: #ff4e88;
}

/* Glow Effect */
.glow {
  text-shadow: 0 0 10px #ff4e88,
               0 0 20px #ff4e88,
               0 0 40px #ff1493;
  animation: glowPulse 2s infinite alternate;
}

@keyframes glowPulse {
  from { text-shadow: 0 0 10px #ff4e88; }
  to { text-shadow: 0 0 30px #ff1493; }
}

h2 {
  margin-top: 20px;
}

button {
  padding: 15px 30px;
  font-size: 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin: 15px;
}

#yesBtn {
  background: #ff4e88;
  color: white;
}

#noBtn {
  background: #555;
  color: white;
  position: absolute;
}

/* Letter */
#letter {
  display: none;
  margin-top: 30px;
  font-size: 22px;
  color: #ffb6c1;
  animation: fadeIn 2s;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

/* Hearts */
.heart {
  position: absolute;
  color: #ff4e88;
  font-size: 25px;
  animation: float 5s linear infinite;
  z-index: 1;
}

@keyframes float {
  from {transform: translateY(100vh);}
  to {transform: translateY(-10vh);}
}

</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="container">

<h1>Sorry <span class="glow">Pinki 💖</span></h1>
<h2>Kya tum mujhe maaf karogi? 🥺</h2>

<button id="yesBtn" onclick="accept()">Yes 💖</button>
<button id="noBtn" onmouseover="moveButton()">No 😏</button>

<div id="letter">
💌 Pinki,
<br><br>
Main officially duniya ka sabse bada bewakoof hoon 😭  
Please mujhe maaf kar do 💖  
Main promise karta hoon dobara galti nahi hogi 🥺  
Love you infinity ♾️
</div>

</div>

<script>

// Create Stars
for(let i=0;i<120;i++){
  let star=document.createElement("div");
  star.className="star";
  star.style.width=star.style.height=Math.random()*2+"px";
  star.style.top=Math.random()*100+"vh";
  star.style.left=Math.random()*100+"vw";
  document.body.appendChild(star);
}

// Initial No button position
window.onload=function(){
  const btn=document.getElementById("noBtn");
  btn.style.top="70%";
  btn.style.left="55%";
}

function accept(){

  // Romantic background change
  document.body.style.background =
  "radial-gradient(circle at center, #2c003e 0%, #000000 100%)";

  document.getElementById("letter").style.display="block";

  // Play music
  document.getElementById("bgMusic").play();

  createHearts();
}

function moveButton(){
  var btn=document.getElementById("noBtn");

  const maxX=window.innerWidth - btn.offsetWidth - 20;
  const maxY=window.innerHeight - btn.offsetHeight - 20;

  btn.style.left=Math.random()*maxX+"px";
  btn.style.top=Math.random()*maxY+"px";
}

function createHearts(){
  for(let i=0;i<40;i++){
    let heart=document.createElement("div");
    heart.innerHTML="💖";
    heart.className="heart";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(heart);
  }
}

</script>

</body>
</html>
