<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Pinki 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
color:white;
background:radial-gradient(circle at center,#0b1026 0%,#16213e 50%,#000000 100%);
transition:background 2s ease;
}

/* Stars */
.star{
position:absolute;
background:white;
border-radius:50%;
opacity:0.7;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:0.3;}
to{opacity:1;}
}

.container{text-align:center;z-index:10;}

.glow{
color:#ff4e88;
text-shadow:0 0 15px #ff4e88;
animation:pulse 2s infinite alternate;
}

@keyframes pulse{
from{text-shadow:0 0 10px #ff4e88;}
to{text-shadow:0 0 30px #ff1493;}
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:50px;
cursor:pointer;
margin:15px;
font-weight:bold;
}

#yesBtn{background:#ff4e88;color:white;}
#noBtn{background:#444;color:white;position:fixed;}

#message{
margin-top:20px;
font-size:24px;
color:#ffc0cb;
white-space:pre-line;
}

/* Flip Card */
.flip-card{
width:300px;
height:200px;
margin:20px auto;
perspective:1000px;
opacity:0;
transition:opacity 1.5s ease;
}

.flip-inner{
position:relative;
width:100%;
height:100%;
text-align:center;
transform-style:preserve-3d;
transition:transform 1s;
}

.flip-front, .flip-back{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
padding:20px;
}

.flip-front{background:#ff4e88;}
.flip-back{
background:#ff1493;
transform:rotateY(180deg);
}

.flip-card.show{
opacity:1;
}

.flip-card.flipped .flip-inner{
transform:rotateY(180deg);
}

</style>
</head>

<body>

<div class="container">
<h1 class="glow">Sorry Pinki 💖</h1>
<h2>Kya tum mujhe maaf karogi? 🥺</h2>
<button id="yesBtn" onclick="startLove()">Yes 💕</button>
<button id="noBtn" onmouseover="moveNo()" ontouchstart="moveNo()">No 😏</button>

<div id="message"></div>

<div class="flip-card" id="loveCard">
<div class="flip-inner">
<div class="flip-front">Click Me 💌</div>
<div class="flip-back">Tum meri duniya ho ❤️<br>Forever Yours 💖</div>
</div>
</div>

</div>

<script>

/* Stars */
for(let i=0;i<120;i++){
let star=document.createElement("div");
star.className="star";
star.style.width=star.style.height=Math.random()*3+"px";
star.style.top=Math.random()*100+"vh";
star.style.left=Math.random()*100+"vw";
document.body.appendChild(star);
}

/* No Button Logic */
let moveCount=0;
let scale=1;

function moveNo(){
moveCount++;
if(moveCount>=10){
document.getElementById("noBtn").style.display="none";
return;
}
scale+=0.3;
document.getElementById("yesBtn").style.transform=`scale(${scale})`;
let btn=document.getElementById("noBtn");
btn.style.left=Math.random()*80+"vw";
btn.style.top=Math.random()*80+"vh";
}

/* Yes Click */
function startLove(){

// YES button gayab
document.getElementById("yesBtn").style.display="none";

// Soft pink mix (night visible rahega)
document.body.style.background=
"radial-gradient(circle at center,#1a0033 0%,#330033 40%,#ff4e88 100%)";

let text="Pinki 💖\nMain dil se sorry hoon 🥺\nTum meri life ka best part ho ❤️";
typeWriter(text,0);

// Card fade in
let card=document.getElementById("loveCard");
card.classList.add("show");

// Flip on click
card.addEventListener("click",function(){
card.classList.add("flipped");

setTimeout(()=>{
card.style.opacity="0";
},3000);

});

}

/* Typewriter */
function typeWriter(text,i){
if(i<text.length){
document.getElementById("message").innerHTML+=text.charAt(i);
setTimeout(()=>typeWriter(text,i+1),50);
}
}

</script>

</body>
</html>
