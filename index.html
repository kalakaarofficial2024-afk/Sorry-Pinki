<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Pinki 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
color:white;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
transition:1s;
}

/* Loading Screen */
#loader{
position:fixed;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
z-index:1000;
animation:fadeOut 3s forwards;
}

@keyframes fadeOut{
0%{opacity:1;}
90%{opacity:1;}
100%{opacity:0;visibility:hidden;}
}

/* Main Box */
.container{
text-align:center;
z-index:10;
}

.glow{
color:#ff4e88;
text-shadow:0 0 15px #ff4e88;
animation:pulse 2s infinite alternate;
}

@keyframes pulse{
from{ text-shadow:0 0 10px #ff4e88;}
to{ text-shadow:0 0 30px #ff1493;}
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:50px;
cursor:pointer;
margin:15px;
font-weight:bold;
}

#yesBtn{background:#ff4e88;color:white;}
#noBtn{background:#444;color:white;position:fixed;}

#message{
margin-top:20px;
font-size:24px;
color:#ffc0cb;
white-space:pre-line;
}

/* Flip Card */
.flip-card{
width:300px;
height:200px;
margin:20px auto;
perspective:1000px;
}

.flip-inner{
position:relative;
width:100%;
height:100%;
text-align:center;
transition:transform 1s;
transform-style:preserve-3d;
}

.flip-card.flipped .flip-inner{
transform:rotateY(180deg);
}

.flip-front, .flip-back{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
padding:20px;
}

.flip-front{
background:#ff4e88;
}

.flip-back{
background:#ff1493;
transform:rotateY(180deg);
}

/* Heart Trail */
.trail{
position:absolute;
font-size:18px;
pointer-events:none;
animation:fade 1s linear forwards;
}

@keyframes fade{
0%{opacity:1;}
100%{opacity:0;transform:translateY(-20px);}
}

</style>
</head>

<body>

<div id="loader">Loading Love... 💖</div>

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container" id="mainContent" style="display:none;">
<h1 class="glow">Sorry Pinki 💖</h1>
<h2>Kya tum mujhe maaf karogi? 🥺</h2>
<button id="yesBtn" onclick="startLove()">Yes 💕</button>
<button id="noBtn" onmouseover="moveNo()" ontouchstart="moveNo()">No 😏</button>

<div id="message"></div>

<div class="flip-card" id="loveCard">
<div class="flip-inner">
<div class="flip-front">Click Me 💌</div>
<div class="flip-back">Tum meri duniya ho ❤️<br>Forever Yours 💖</div>
</div>
</div>

</div>

<script>

setTimeout(()=>{
document.getElementById("mainContent").style.display="block";
},3000);

let moveCount=0;
let scale=1;

function moveNo(){
moveCount++;
if(moveCount>=10){
document.getElementById("noBtn").style.display="none";
return;
}
scale+=0.3;
document.getElementById("yesBtn").style.transform=`scale(${scale})`;
let btn=document.getElementById("noBtn");
btn.style.left=Math.random()*80+"vw";
btn.style.top=Math.random()*80+"vh";
}

function startLove(){

document.getElementById("bgMusic").play();

document.body.style.background="linear-gradient(45deg,#ff4e88,#ff1493,#ff69b4)";

let text="Pinki 💖\nMain dil se sorry hoon 🥺\nTum meri life ka best part ho ❤️";
typeWriter(text,0);

document.getElementById("loveCard").classList.add("flipped");

}

/* Typewriter */
function typeWriter(text,i){
if(i<text.length){
document.getElementById("message").innerHTML+=text.charAt(i);
setTimeout(()=>typeWriter(text,i+1),50);
}
}

/* Heart Trail */
document.addEventListener("mousemove",function(e){
let heart=document.createElement("div");
heart.className="trail";
heart.innerHTML="💖";
heart.style.left=e.pageX+"px";
heart.style.top=e.pageY+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),1000);
});

</script>

</body>
</html>
