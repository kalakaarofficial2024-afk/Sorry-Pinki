<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorry Pinki 💖</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            background: black;
            touch-action: manipulation;
        }

        /* Intro Overlay */
        #intro {
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            z-index: 9999;
            animation: introFade 4s forwards;
            pointer-events: none;
        }
        @keyframes introFade {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* Night Background */
        .mainBg {
            background: radial-gradient(circle at center, #0b1026 0%, #16213e 50%, #000000 100%);
            transition: background 2s ease;
        }

        .pulseBg {
            animation: heartPulse 4s infinite ease-in-out;
        }
        @keyframes heartPulse {
            0% { box-shadow: 0 0 40px #ff4e88 inset; }
            50% { box-shadow: 0 0 120px #ff1493 inset; }
            100% { box-shadow: 0 0 40px #ff4e88 inset; }
        }

        /* SHOOTING STAR: Head Left-Bottom, Tail Right-Top */
        .shoot {
            position: absolute;
            width: 3px;
            height: 150px;
            /* Gradient flipped: White (head) at bottom-left */
            background: linear-gradient(to top right, white, transparent);
            filter: drop-shadow(0 0 10px white);
            pointer-events: none;
            animation: shooting 1.8s linear forwards;
        }

        @keyframes shooting {
            0% {
                opacity: 1;
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                opacity: 0;
                /* Moves towards Left (-X) and Bottom (+Y) */
                transform: translate(-800px, 800px) rotate(0deg);
            }
        }

        .sparkle {
            position: absolute;
            font-size: 14px;
            pointer-events: none;
            animation: sparkleFade 1s linear forwards;
            z-index: 1000;
        }
        @keyframes sparkleFade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        .container { text-align: center; z-index: 10; width: 90%; max-width: 400px; }
        
        .glow {
            font-size: clamp(35px, 10vw, 55px);
            color: #ff4e88;
            text-shadow: 0 0 15px #ff4e88;
            animation: pulseText 2s infinite alternate;
        }
        @keyframes pulseText {
            from { text-shadow: 0 0 10px #ff4e88; }
            to { text-shadow: 0 0 30px #ff1493; }
        }

        .btn-wrapper {
            position: relative;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 15px 35px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #yesBtn { background: #ff4e88; color: white; z-index: 10; }
        #noBtn { background: #444; color: white; position: fixed; z-index: 9; }

        #message {
            margin-top: 20px;
            font-size: 22px;
            color: #ffc0cb;
            white-space: pre-line;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="intro">✨ A Special Moment Begins... 💖</div>

    <div class="container">
        <div id="ui">
            <h1 class="glow">Sorry Pinki 💖</h1>
            <h2>Kya tum mujhe maaf karogi? 🥺</h2>
            <div class="btn-wrapper">
                <button id="yesBtn" onclick="startLove()">Yes 💕</button>
                <button id="noBtn" onmouseover="moveNo()" ontouchstart="moveNo()">No 😏</button>
            </div>
        </div>
        <div id="message"></div>
    </div>

    <div id="ytContainer" style="display:none;"></div>

<script>
    setTimeout(() => { document.body.classList.add("mainBg"); }, 4000);

    let moveCount = 0;
    let scale = 1;

    function moveNo() {
        moveCount++;
        if (moveCount >= 10) {
            let noBtn = document.getElementById("noBtn");
            noBtn.innerHTML = "Yes 💕";
            noBtn.style.background = "#ff4e88";
            noBtn.onclick = startLove;
            noBtn.onmouseover = null;
            noBtn.ontouchstart = null;
            return;
        }

        scale += 0.35;
        document.getElementById("yesBtn").style.transform = `scale(${scale})`;

        let btn = document.getElementById("noBtn");
        let x = Math.random() * (window.innerWidth - btn.offsetWidth - 40) + 20;
        let y = Math.random() * (window.innerHeight - btn.offsetHeight - 40) + 20;
        btn.style.left = x + "px";
        btn.style.top = y + "px";
    }

    function startLove() {
        const videoId = "5r5mW0XvFJ8";
        document.getElementById("ytContainer").innerHTML = 
            `<iframe width="0" height="0" src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&playlist=${videoId}&loop=1" allow="autoplay"></iframe>`;

        document.getElementById("ui").style.display = "none";
        document.body.classList.add("pulseBg");
        document.body.style.background = "radial-gradient(circle at center,#1a0033 0%,#330033 40%,#ff4e88 100%)";

        const text = "Pinki...\n\nTum meri life ka sabse haseen hissa ho 💕\nMain dil se sorry hoon 🥺\nPlease mujhe maaf kar do ❤️\n\nForever yours 💖";
        typeWriter(text, 0);

        setInterval(createStar, 3000);
    }

    function typeWriter(text, i) {
        if (i < text.length) {
            document.getElementById("message").innerHTML += text.charAt(i);
            setTimeout(() => typeWriter(text, i + 1), 60);
        }
    }

    function createStar() {
        let star = document.createElement("div");
        star.className = "shoot";
        // Starting from TOP-RIGHT
        star.style.right = "0px";
        star.style.top = Math.random() * 50 + "vh"; // Random start height on right side
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 2000);
    }

    function handleSparkle(e) {
        let sparkle = document.createElement("div");
        sparkle.className = "sparkle";
        sparkle.innerHTML = "✨";
        let x = e.pageX || (e.touches ? e.touches[0].pageX : 0);
        let y = e.pageY || (e.touches ? e.touches[0].pageY : 0);
        sparkle.style.left = x + "px";
        sparkle.style.top = y + "px";
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 800);
    }

    document.addEventListener("mousemove", handleSparkle);
    document.addEventListener("touchstart", handleSparkle);
</script>

</body>
</html>
