<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorry Pinki 💖</title>
    <style>
        body {
            margin: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 2.3rem;
            margin-bottom: 10px;
        }

        .cute-name {
            display: inline-block;
            color: #ff4d6d;
            animation: wiggle 1s infinite alternate, glow 1.5s infinite;
        }

        @keyframes wiggle {
            from { transform: rotate(-3deg); }
            to { transform: rotate(3deg); }
        }

        @keyframes glow {
            0% { text-shadow: 0 0 5px #ff4d6d; }
            50% { text-shadow: 0 0 20px #ff85a1; }
            100% { text-shadow: 0 0 5px #ff4d6d; }
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .buttons {
            position: relative;
            height: 60px;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: absolute;
        }

        #forgive {
            background: #4CAF50;
            color: white;
            left: 30%;
        }

        #nope {
            background: #f44336;
            color: white;
            left: 60%;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.3rem;
        }

        .emoji {
            font-size: 3rem;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .heart {
            position: fixed;
            top: -10px;
            font-size: 20px;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Romantic Background Music -->
    <audio id="bg-music" autoplay loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <div class="emoji">🥺</div>
        <h1><span class="cute-name">Pinki</span>, I Am Really Sorry! 💖</h1>
        <p>Pinki, I messed up. My bad. 100% certified mistake. Please forgive me? 🥺💗</p>

        <div class="buttons">
            <button id="forgive">Okay, I forgive you 😇</button>
            <button id="nope">Nope 😈</button>
        </div>

        <div id="message"></div>
    </div>

    <script>
        const nopeBtn = document.getElementById('nope');
        const forgiveBtn = document.getElementById('forgive');
        const message = document.getElementById('message');

        nopeBtn.addEventListener('mouseover', () => {
            const x = Math.random() * 250;
            const y = Math.random() * 40;
            nopeBtn.style.left = x + 'px';
            nopeBtn.style.top = y + 'px';
        });

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        forgiveBtn.addEventListener('click', () => {
            message.innerHTML = "YAY!!! Pinki is officially the best human ever 🏆💖";
            document.body.style.background = "linear-gradient(135deg, #a1ffce, #faffd1)";

            // Make hearts fall
            setInterval(createHeart, 300);
        });
    </script>
</body>
</html>
