<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Pinki 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
color:white;
background:radial-gradient(circle at center,#0b1026 0%,#16213e 50%,#000000 100%);
transition:background 2s ease;
}

/* Slow Heart Pulse Glow */
.pulseBg{
animation:heartPulse 4s infinite ease-in-out;
}

@keyframes heartPulse{
0%{box-shadow:0 0 50px #ff4e88 inset;}
50%{box-shadow:0 0 120px #ff1493 inset;}
100%{box-shadow:0 0 50px #ff4e88 inset;}
}

/* Stars */
.star{
position:absolute;
background:white;
border-radius:50%;
opacity:0.8;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:0.3;}
to{opacity:1;}
}

/* Shooting Star */
.shoot{
position:absolute;
width:3px;
height:100px;
background:linear-gradient(white,transparent);
transform:rotate(45deg);
animation:shooting 1s linear forwards;
}

@keyframes shooting{
0%{opacity:1;transform:translate(0,0) rotate(45deg);}
100%{opacity:0;transform:translate(400px,400px) rotate(45deg);}
}

/* Sparkle Cursor */
.sparkle{
position:absolute;
font-size:14px;
pointer-events:none;
animation:sparkleFade 1s linear forwards;
}

@keyframes sparkleFade{
0%{opacity:1;transform:scale(1);}
100%{opacity:0;transform:scale(0);}
}

.container{text-align:center;z-index:10;}

.glow{
color:#ff4e88;
text-shadow:0 0 15px #ff4e88;
animation:pulse 2s infinite alternate;
}

@keyframes pulse{
from{text-shadow:0 0 10px #ff4e88;}
to{text-shadow:0 0 30px #ff1493;}
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:50px;
cursor:pointer;
margin:15px;
font-weight:bold;
}

#yesBtn{background:#ff4e88;color:white;}
#noBtn{background:#444;color:white;position:fixed;}

#message{
margin-top:20px;
font-size:24px;
color:#ffc0cb;
white-space:pre-line;
}

</style>
</head>

<body>

<div class="container">
<h1 class="glow">Sorry Pinki 💖</h1>
<h2>Kya tum mujhe maaf karogi? 🥺</h2>
<button id="yesBtn" onclick="startLove()">Yes 💕</button>
<button id="noBtn" onmouseover="moveNo()" ontouchstart="moveNo()">No 😏</button>

<div id="message"></div>
</div>

<script>

/* Create Stars */
for(let i=0;i<120;i++){
let star=document.createElement("div");
star.className="star";
star.style.width=star.style.height=Math.random()*3+"px";
star.style.top=Math.random()*100+"vh";
star.style.left=Math.random()*100+"vw";
document.body.appendChild(star);
}

/* No Button Logic */
let moveCount=0;
let scale=1;

function moveNo(){
moveCount++;
if(moveCount>=10){
document.getElementById("noBtn").style.display="none";
return;
}
scale+=0.3;
document.getElementById("yesBtn").style.transform=`scale(${scale})`;
let btn=document.getElementById("noBtn");
btn.style.left=Math.random()*80+"vw";
btn.style.top=Math.random()*80+"vh";
}

/* Yes Click */
function startLove(){

// Yes button hide
document.getElementById("yesBtn").style.display="none";

// Soft pink night mix
document.body.style.background=
"radial-gradient(circle at center,#1a0033 0%,#330033 40%,#ff4e88 100%)";

// Add slow heart pulse glow
document.body.classList.add("pulseBg");

// Message
let text="Pinki 💖\nMain dil se sorry hoon 🥺\nTum meri life ka best part ho ❤️";
typeWriter(text,0);

// Start shooting stars
setInterval(createShootingStar,2000);

}

/* Typewriter */
function typeWriter(text,i){
if(i<text.length){
document.getElementById("message").innerHTML+=text.charAt(i);
setTimeout(()=>typeWriter(text,i+1),50);
}
}

/* Shooting Star */
function createShootingStar(){
let star=document.createElement("div");
star.className="shoot";
star.style.top=Math.random()*50+"vh";
star.style.left=Math.random()*50+"vw";
document.body.appendChild(star);
setTimeout(()=>star.remove(),1000);
}

/* Sparkle Cursor */
document.addEventListener("mousemove",function(e){
let sparkle=document.createElement("div");
sparkle.className="sparkle";
sparkle.innerHTML="✨";
sparkle.style.left=e.pageX+"px";
sparkle.style.top=e.pageY+"px";
document.body.appendChild(sparkle);
setTimeout(()=>sparkle.remove(),1000);
});

</script>

</body>
</html>
