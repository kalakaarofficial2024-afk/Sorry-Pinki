<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry Pinki 💖</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at top, #1a1a2e, #16213e, #0f3460);
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle { from {opacity: 0.3;} to {opacity: 1;} }

        .container {
            z-index: 10;
            padding: 20px;
        }

        h1 { font-size: 50px; color: #ff4e88; text-shadow: 0 0 15px rgba(255, 78, 136, 0.6); }
        h2 { font-weight: 300; margin-bottom: 30px; }

        .btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 200px;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease-out;
            font-weight: bold;
        }

        #yesBtn {
            background: #ff4e88;
            color: white;
            box-shadow: 0 0 20px rgba(255, 78, 136, 0.4);
            z-index: 1000;
        }

        #noBtn {
            background: #555;
            color: white;
            position: fixed;
            z-index: 999;
        }

        #message {
            margin-top: 30px;
            font-size: 26px;
            line-height: 1.6;
            color: #ffb6c1;
            white-space: pre-line;
        }

        .heart {
            position: absolute;
            pointer-events: none;
            animation: floatUp 5s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="setup">
        <h1>Sorry Pinki 💖</h1>
        <h2>Kya tum mujhe maaf karogi? 🥺</h2>
        <div class="btn-wrapper">
            <button id="yesBtn" onclick="startLove()">Yes 💕</button>
            <button id="noBtn" onmouseover="moveAndGrow()" onclick="moveAndGrow()">No 😏</button>
        </div>
    </div>
    <div id="message"></div>
</div>

<div id="ytContainer"></div>

<script>
    // Stars Background
    for(let i=0; i<120; i++){
        let star = document.createElement("div");
        star.className = "star";
        star.style.width = star.style.height = Math.random()*3+"px";
        star.style.top = Math.random()*100+"vh";
        star.style.left = Math.random()*100+"vw";
        document.body.appendChild(star);
    }

    let scale = 1;
    let yesBtn = document.getElementById("yesBtn");

    function moveAndGrow() {
        // 1. Grow Yes Button
        scale += 0.3; 
        yesBtn.style.transform = `scale(${scale})`;

        // 2. Move No Button
        let btn = document.getElementById("noBtn");
        let x = Math.random() * (window.innerWidth - btn.offsetWidth - 40) + 20;
        let y = Math.random() * (window.innerHeight - btn.offsetHeight - 40) + 20;
        btn.style.left = x + "px";
        btn.style.top = y + "px";
    }

    function startLove() {
        // Play Song - Fixed logic
        const videoId = "5r5mW0XvFJ8";
        document.getElementById("ytContainer").innerHTML = 
            `<iframe width="0" height="0" src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&loop=1&playlist=${videoId}" frameborder="0" allow="autoplay"></iframe>`;

        // UI Changes
        document.getElementById("setup").style.display = "none";
        
        let text = "Pinki...\n\nTum meri life ka sabse beautiful part ho 💕\nMain dil se sorry hoon 🥺\nPlease mujhe maaf kar do ❤️\nForever yours 💖";
        typeWriter(text, 0);
        setInterval(createHeart, 300);
    }

    function typeWriter(text, i) {
        if (i < text.length) {
            document.getElementById("message").innerHTML += text.charAt(i);
            setTimeout(() => typeWriter(text, i + 1), 50);
        }
    }

    function createHeart() {
        let heart = document.createElement("div");
        heart.innerHTML = "💖";
        heart.className = "heart";
        heart.style.left = Math.random()*100+"vw";
        heart.style.fontSize = Math.random()*20+20+"px";
        heart.style.animationDuration = (Math.random()*3+2)+"s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }
</script>

</body>
</html>
