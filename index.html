<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
}

body {
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background: radial-gradient(circle at center, #0b1026 0%, #16213e 50%, #000000 100%);
  background-attachment: fixed;
  position: relative;
}

/* Stars */
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.6;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from {opacity: 0.3;}
  to {opacity: 1;}
}

/* Center content */
body > *:not(.star) {
  position: relative;
  z-index: 2;
}

h1 {
  margin-top: 80px;
  font-size: 50px;
  color: #ff4e88;
}

/* Glow Text */
.glow {
  text-shadow: 0 0 10px #ff4e88,
               0 0 20px #ff4e88,
               0 0 40px #ff1493;
  animation: glowPulse 2s infinite alternate;
}

@keyframes glowPulse {
  from { text-shadow: 0 0 10px #ff4e88; }
  to { text-shadow: 0 0 30px #ff1493; }
}
</style>
