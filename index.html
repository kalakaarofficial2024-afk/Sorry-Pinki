<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry Pinki 💖</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            /* Wapis wahi Night Theme */
            background: radial-gradient(circle at top, #1a1a2e, #16213e, #0f3460);
            overflow: hidden;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Stars */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 600px;
        }

        h1 {
            font-size: 50px;
            color: #ff4e88;
            text-shadow: 0 0 10px rgba(255, 78, 136, 0.5);
        }

        h2 {
            font-weight: 300;
            margin-bottom: 20px;
        }

        /* Button Styling */
        .btn-wrapper {
            position: relative;
            height: 150px; /* Space for moving button */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }

        #yesBtn {
            background: #ff4e88;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 78, 136, 0.4);
            z-index: 10;
        }

        #noBtn {
            background: #555;
            color: white;
            position: absolute; /* Needed for moving */
            left: 60%; /* Initial position */
            transition: all 0.2s ease;
        }

        #message {
            margin-top: 30px;
            font-size: 24px;
            min-height: 120px;
            white-space: pre-line;
            color: #ffb6c1;
            line-height: 1.5;
        }

        .heart {
            position: absolute;
            font-size: 25px;
            pointer-events: none;
            animation: floatUp 5s linear forwards;
        }

        @keyframes floatUp {
            from { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            to { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="main-content">
        <h1>Sorry Pinki 💖</h1>
        <h2 id="question">Kya tum mujhe maaf karogi? 🥺</h2>

        <div class="btn-wrapper">
            <button id="yesBtn" onclick="startLove()">Yes 💕</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 😏</button>
        </div>
    </div>

    <div id="message"></div>
</div>

<div id="ytContainer" style="display:none;"></div>

<script>
    // Create Stars Background
    for(let i=0; i<150; i++){
        let star = document.createElement("div");
        star.className = "star";
        star.style.top = Math.random() * 100 + "vh";
        star.style.left = Math.random() * 100 + "vw";
        star.style.animationDelay = Math.random() * 2 + "s";
        document.body.appendChild(star);
    }

    // Move No Button within visible bounds
    function moveButton() {
        var btn = document.getElementById("noBtn");
        
        // Calculate safe area (avoiding screen edges)
        var padding = 50;
        var maxX = window.innerWidth - btn.offsetWidth - padding;
        var maxY = window.innerHeight - btn.offsetHeight - padding;
        
        var randomX = Math.max(padding, Math.floor(Math.random() * maxX));
        var randomY = Math.max(padding, Math.floor(Math.random() * maxY));

        btn.style.position = "fixed"; // Switch to fixed to move anywhere on screen
        btn.style.left = randomX + "px";
        btn.style.top = randomY + "px";
    }

    function startLove() {
        // 1. Play the Song (Your ID: 5r5mW0XvFJ8)
        const videoId = "5r5mW0XvFJ8";
        document.getElementById("ytContainer").innerHTML = 
            `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}" allow="autoplay"></iframe>`;

        // 2. Hide Title and Buttons
        document.getElementById("main-content").style.display = "none";

        // 3. Show Heart Animation & Message
        let text = "Pinki...\n\nTum meri life ka sabse beautiful part ho 💕\nMain dil se sorry hoon 🥺\nPlease mujhe maaf kar do ❤️\n\nForever yours 💖";
        typeWriter(text, 0);
        setInterval(createFloatingHeart, 300);
    }

    function typeWriter(text, i) {
        if (i < text.length) {
            document.getElementById("message").innerHTML += text.charAt(i);
            setTimeout(function() {
                typeWriter(text, i + 1);
            }, 60);
        }
    }

    function createFloatingHeart() {
        let heart = document.createElement("div");
        heart.innerHTML = "💖";
        heart.className = "heart";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
        document.body.appendChild(heart);
        
        setTimeout(() => heart.remove(), 5000);
    }
</script>

</body>
</html>
