<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry Pinki 💖</title>
    <style>
        :root {
            --pink: #ff4e88;
            --glow: #ffb6c1;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f3460 100%);
            overflow: hidden;
            color: white;
        }

        /* Animated Stars Background */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.3; transform: scale(1); }
            to { opacity: 1; transform: scale(1.2); }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            max-width: 90%;
        }

        h1 {
            font-size: 3.5rem;
            color: var(--pink);
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--pink);
        }

        h2 {
            font-weight: 300;
            margin-bottom: 30px;
        }

        .btn-group {
            position: relative;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #yesBtn {
            background: var(--pink);
            color: white;
            z-index: 100;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px var(--pink);
        }

        #noBtn {
            background: #444;
            color: #ccc;
            position: absolute;
        }

        #message {
            margin-top: 30px;
            font-size: 1.5rem;
            line-height: 1.6;
            min-height: 100px;
            color: var(--glow);
            text-shadow: 0 0 5px rgba(255,182,193,0.5);
        }

        .heart {
            position: absolute;
            pointer-events: none;
            animation: float Up 5s linear forwards;
            z-index: 5;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="mainTitle">Sorry Pinki 💖</h1>
        <h2 id="subTitle">Kya tum mujhe maaf karogi? 🥺</h2>

        <div class="btn-group" id="actions">
            <button id="yesBtn" onclick="startLove()">Yes 💕</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 😏</button>
        </div>

        <div id="message"></div>
    </div>

    <div id="ytContainer" style="display:none;"></div>

    <script>
        // Generate Stars
        for (let i = 0; i < 150; i++) {
            let star = document.createElement("div");
            star.className = "star";
            let size = Math.random() * 3 + "px";
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + "vh";
            star.style.left = Math.random() * 100 + "vw";
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            document.body.appendChild(star);
        }

        let yesScale = 1;
        let noClicks = 0;

        function moveButton() {
            let btn = document.getElementById("noBtn");
            let yesBtn = document.getElementById("yesBtn");

            // Make the No button run away
            let x = Math.random() * (window.innerWidth - btn.offsetWidth);
            let y = Math.random() * (window.innerHeight - btn.offsetHeight);
            
            btn.style.left = x + "px";
            btn.style.top = y + "px";

            // Make the Yes button bigger every time she tries to say No!
            yesScale += 0.15;
            yesBtn.style.transform = `scale(${yesScale})`;
            noClicks++;

            if(noClicks > 5) {
                btn.innerHTML = "Ab toh maan jao! 🙄";
            }
        }

        function startLove() {
            // 1. Play Song (Using your specified ID)
            const videoId = "5r5mW0XvFJ8";
            document.getElementById("ytContainer").innerHTML = 
                `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}" allow="autoplay"></iframe>`;

            // 2. Hide Buttons
            document.getElementById("actions").style.display = "none";
            document.getElementById("subTitle").style.display = "none";
            
            // 3. Start Animation and Text
            let text = "Pinki...\n\nTum meri life ka sabse beautiful part ho 💕\nMain dil se sorry hoon 🥺\nPlease mujhe maaf kar do ❤️\n\nForever yours 💖";
            typeWriter(text, 0);
            setInterval(createHeart, 300);
        }

        function typeWriter(text, i) {
            if (i < text.length) {
                let char = text.charAt(i);
                document.getElementById("message").innerHTML += (char === "\n") ? "<br>" : char;
                setTimeout(() => typeWriter(text, i + 1), 60);
            }
        }

        function createHeart() {
            const heart = document.createElement("div");
            const icons = ["💖", "💗", "🌸", "✨", "🥰"];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            heart.className = "heart";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (Math.random() * 20 + 20) + "px";
            heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
            document.body.appendChild(heart);

            // Clean up hearts after they float away
            setTimeout(() => heart.remove(), 5000);
        }
    </script>
</body>
</html>
