<!DOCTYPE html>
<html>
<head>
<title>Sorry Pinki 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  text-align: center;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(to right, #ff9a9e, #fad0c4);
  overflow: hidden;
  color: white;
}

.container {
  margin-top: 15vh;
}

h1 {
  font-size: 55px;
  text-shadow: 2px 2px 15px rgba(0,0,0,0.4);
}

h2 {
  font-weight: normal;
}

button {
  padding: 15px 35px;
  font-size: 20px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  margin: 20px;
  transition: 0.3s;
}

#yesBtn {
  background: #ff4e50;
  color: white;
}

#yesBtn:hover {
  transform: scale(1.1);
}

#noBtn {
  background: #444;
  color: white;
  position: absolute;
}

#finalMessage {
  display: none;
  font-size: 30px;
  margin-top: 30px;
  animation: fadeIn 2s ease-in-out;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

.heart {
  position: absolute;
  font-size: 22px;
  animation: float 6s linear infinite;
}

@keyframes float {
  from {transform: translateY(100vh);}
  to {transform: translateY(-10vh);}
}
</style>
</head>

<body>

<div class="container">
  <h1>Sorry Pinki 💖</h1>
  <h2>Kya tum mujhe maaf karogi? 🥺</h2>

  <button id="yesBtn" onclick="accept()">Yes 💕</button>
  <button id="noBtn" onmouseover="moveButton()">No 😏</button>

  <div id="finalMessage">
    💌 Pinki...  
    <br><br>
    Tum meri smile ka reason ho 💕  
    Main dil se sorry hoon 🥺  
    Please mujhe maaf kar do ❤️  
    I promise forever yours 💖
  </div>
</div>

<!-- Soft Romantic Piano -->
<audio autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9e1f34.mp3?filename=romantic-soft-piano-110624.mp3" type="audio/mpeg">
</audio>

<script>

function accept() {
  document.getElementById("finalMessage").style.display = "block";
  fireworks();
}

function moveButton() {
  var btn = document.getElementById("noBtn");
  btn.style.top = Math.random() * window.innerHeight + "px";
  btn.style.left = Math.random() * window.innerWidth + "px";
}

function fireworks() {
  for(let i=0;i<40;i++){
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "heart";
    heart.style.left = Math.random()*100+"vw";
    heart.style.animationDuration = (Math.random()*4+3)+"s";
    document.body.appendChild(heart);
  }
}

</script>

</body>
</html>
