<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Pinki 💖</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background: radial-gradient(circle at center, #0b1026 0%, #16213e 50%, #000000 100%);
    color:white;
    position:relative;
}

/* Glow Heading */
.glow{
    color:#ff4e88;
    text-shadow:0 0 10px #ff4e88,0 0 20px #ff1493;
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 10px #ff4e88;}
    to{ text-shadow:0 0 30px #ff1493;}
}

.container{
    z-index:10;
}

button{
    padding:15px 35px;
    font-size:20px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    font-weight:bold;
    margin:15px;
    transition:0.2s;
}

#yesBtn{
    background:#ff4e88;
    color:white;
}

#noBtn{
    background:#555;
    color:white;
    position:fixed;
}

#message{
    margin-top:20px;
    font-size:24px;
    color:#ffb6c1;
}

/* Emoji Explosion */
.emoji{
    position:absolute;
    font-size:30px;
    animation:explode 3s linear forwards;
}

@keyframes explode{
    0%{
        transform:translate(0,0) scale(0);
        opacity:1;
    }
    100%{
        transform:translate(var(--x), var(--y)) scale(1.5);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="container">
    <div id="setup">
        <h1 class="glow">Sorry Pinki 💖</h1>
        <h2>Kya tum mujhe maaf karogi? 🥺</h2>

        <button id="yesBtn" onclick="startLove()">Yes 💕</button>
        <button id="noBtn" onmouseover="moveNo()" ontouchstart="moveNo()">No 😏</button>
    </div>

    <div id="message"></div>
</div>

<script>

let scale=1;

function moveNo(){
    scale+=0.3;
    document.getElementById("yesBtn").style.transform=`scale(${scale})`;

    let btn=document.getElementById("noBtn");
    let x=Math.random()*(window.innerWidth-100);
    let y=Math.random()*(window.innerHeight-50);
    btn.style.left=x+"px";
    btn.style.top=y+"px";
}

function startLove(){

    document.getElementById("setup").style.display="none";

    let text="Pinki 💖\n\nTum meri duniya ho 😘\nMain dil se sorry hoon 🥺\nPlease mujhe maaf kar do ❤️";
    typeWriter(text,0);

    // Massive Emoji Burst
    for(let i=0;i<150;i++){
        createEmoji();
    }
}

function typeWriter(text,i){
    if(i<text.length){
        document.getElementById("message").innerHTML+=text.charAt(i);
        setTimeout(()=>typeWriter(text,i+1),50);
    }
}

function createEmoji(){

    const emojis=["💖","💕","❤️","😍","🥰","😄","🌸","🌹","💐"];

    let emoji=document.createElement("div");
    emoji.className="emoji";
    emoji.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

    emoji.style.left=window.innerWidth/2+"px";
    emoji.style.top=window.innerHeight/2+"px";

    let x=(Math.random()-0.5)*1000+"px";
    let y=(Math.random()-0.5)*1000+"px";

    emoji.style.setProperty('--x',x);
    emoji.style.setProperty('--y',y);

    document.body.appendChild(emoji);

    setTimeout(()=>emoji.remove(),3000);
}

</script>

</body>
</html>
