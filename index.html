<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Pinki 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
color:white;
background:black;
position:relative;
}

/* Intro */
#intro{
position:fixed;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
z-index:9999;
animation:introFade 4s forwards;
}
@keyframes introFade{
0%{opacity:1;}
70%{opacity:1;}
100%{opacity:0;visibility:hidden;}
}

/* Night Background */
.mainBg{
background:radial-gradient(circle at center,#0b1026 0%,#16213e 50%,#000000 100%);
transition:background 2s ease;
}

/* Heart Pulse */
.pulseBg{
animation:heartPulse 4s infinite ease-in-out;
}
@keyframes heartPulse{
0%{box-shadow:0 0 40px #ff4e88 inset;}
50%{box-shadow:0 0 120px #ff1493 inset;}
100%{box-shadow:0 0 40px #ff4e88 inset;}
}

/* Floating Hearts */
.floatHeart{
position:absolute;
color:#ff4e88;
opacity:0.4;
animation:floatUp 10s linear infinite;
pointer-events:none;
}
@keyframes floatUp{
0%{transform:translateY(100vh);opacity:0;}
50%{opacity:0.6;}
100%{transform:translateY(-10vh);opacity:0;}
}

/* Blinking Stars */
.star{
position:absolute;
background:white;
border-radius:50%;
opacity:0;
pointer-events:none;
animation:blink 2s infinite;
}
@keyframes blink{
0%,100%{opacity:0;}
50%{opacity:1;}
}

.container{text-align:center;z-index:10;position:relative;}
.glow{
color:#ff4e88;
text-shadow:0 0 15px #ff4e88;
animation:pulse 2s infinite alternate;
}
@keyframes pulse{
from{text-shadow:0 0 10px #ff4e88;}
to{text-shadow:0 0 30px #ff1493;}
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:50px;
cursor:pointer;
margin:15px;
font-weight:bold;
}
#yesBtn{background:#ff4e88;color:white;}
#noBtn{background:#444;color:white;position:fixed;}

#message{
margin-top:20px;
font-size:24px;
color:#ffc0cb;
white-space:pre-line;
}

</style>
</head>

<body>

<div id="intro">✨ A Special Moment Begins... 💖</div>

<div class="container">
<h1 id="mainTitle" class="glow">Sorry Pinki 💖</h1>
<h2 id="subTitle">Kya tum mujhe maaf karogi? 🥺</h2>
<button id="yesBtn" onclick="startLove()">Yes 💕</button>
<button id="noBtn" onmouseover="moveNo()">No 😏</button>
<div id="message"></div>
</div>

<script>

/* Background enable */
setTimeout(()=>{
document.body.classList.add("mainBg");
},4000);

/* Floating Hearts */
setInterval(()=>{
let heart=document.createElement("div");
heart.className="floatHeart";
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=Math.random()*20+10+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),10000);
},900);

/* Blinking Stars */
for(let i=0;i<50;i++){
  let star=document.createElement("div");
  star.className="star";
  let size=Math.random()*2+1; // small star size
  star.style.width=size+"px";
  star.style.height=size+"px";
  star.style.left=Math.random()*100+"vw";
  star.style.top=Math.random()*100+"vh";
  star.style.animationDuration=(Math.random()*2+1)+"s";
  star.style.animationDelay=Math.random()*2+"s"; // random delay
  document.body.appendChild(star);
}

let moveCount=0;
let scale=1;

function moveNo(){
moveCount++;
if(moveCount>=10){
let noBtn=document.getElementById("noBtn");
noBtn.innerHTML="Yes 💕";
noBtn.style.background="#ff4e88";
noBtn.onclick=startLove;
noBtn.onmouseover=null;
return;
}
scale+=0.3;
document.getElementById("yesBtn").style.transform=`scale(${scale})`;
let btn=document.getElementById("noBtn");
btn.style.left=Math.random()*80+"vw";
btn.style.top=Math.random()*80+"vh";
}

function startLove(){
  // Buttons hide
  document.getElementById("yesBtn").style.display="none";
  document.getElementById("noBtn").style.display="none";

  // Change title and subtitle
  document.getElementById("mainTitle").innerText="Thank You ❤️";
  document.getElementById("subTitle").innerText="Mujhe maloom tha tum maaf krdogi 😘";

  // Background pulse
  document.body.style.background=
  "radial-gradient(circle at center,#1a0033 0%,#330033 40%,#ff4e88 100%)";
  document.body.classList.add("pulseBg");

  // Typewriter message
  let text="Tum meri life ka best part ho ❤️ and I promise me kabhi tumhe hurt nahi krunga iss baat ko lekr💕";
  typeWriter(text,0);
}

function typeWriter(text,i){
  if(i<text.length){
    document.getElementById("message").innerHTML+=text.charAt(i);
    setTimeout(()=>typeWriter(text,i+1),50);
  }
}

/* Cursor Sparkle */
document.addEventListener("mousemove",function(e){
let sparkle=document.createElement("div");
sparkle.className="sparkle";
sparkle.innerHTML="✨";
sparkle.style.left=e.pageX+"px";
sparkle.style.top=e.pageY+"px";
document.body.appendChild(sparkle);
setTimeout(()=>sparkle.remove(),1000);
});

</script>

</body>
</html>
