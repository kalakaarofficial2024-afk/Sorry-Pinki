<!DOCTYPE html>
<html>
<head>
<title>Sorry Pinki 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  text-align: center;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #1a1a2e, #16213e, #0f3460);
  overflow: hidden;
  color: white;
}

/* Stars */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from {opacity: 0.2;}
  to {opacity: 1;}
}

.container {
  margin-top: 15vh;
  position: relative;
  z-index: 2;
}

h1 {
  font-size: 50px;
  color: #ff4e88;
}

button {
  padding: 15px 35px;
  font-size: 20px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
  margin: 20px;
  transition: 0.3s;
}

#yesBtn {
  background: #ff4e88;
  color: white;
}

#yesBtn:hover {
  transform: scale(1.1);
}

#noBtn {
  background: #555;
  color: white;
  position: absolute;
}

#message {
  margin-top: 30px;
  font-size: 26px;
  min-height: 120px;
  white-space: pre-line;
}

.heart {
  position: absolute;
  font-size: 20px;
  animation: float 6s linear infinite;
}

@keyframes float {
  from {transform: translateY(100vh);}
  to {transform: translateY(-10vh);}
}
</style>
</head>

<body>

<div class="container">
  <h1>Sorry Pinki 💖</h1>
  <h2>Kya tum mujhe maaf karogi? 🥺</h2>

  <button id="yesBtn" onclick="startLove()">Yes 💕</button>
  <button id="noBtn" onmouseover="moveButton()">No 😏</button>

  <div id="message"></div>
</div>

<!-- Soft Romantic Piano -->
<audio autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9e1f34.mp3?filename=romantic-soft-piano-110624.mp3" type="audio/mpeg">
</audio>

<script>

/* Stars generate */
for(let i=0;i<120;i++){
  let star=document.createElement("div");
  star.className="star";
  star.style.top=Math.random()*100+"vh";
  star.style.left=Math.random()*100+"vw";
  document.body.appendChild(star);
}

function moveButton() {
  var btn = document.getElementById("noBtn");
  btn.style.top = Math.random() * window.innerHeight + "px";
  btn.style.left = Math.random() * window.innerWidth + "px";
}

function startLove() {
  let text = "Pinki...\n\nTum meri life ka sabse beautiful part ho 💕\nMain dil se sorry hoon 🥺\nPlease mujhe maaf kar do ❤️\nForever yours 💖";
  typeWriter(text, 0);
  fireworks();
}

function typeWriter(text, i) {
  if (i < text.length) {
    document.getElementById("message").innerHTML += text.charAt(i);
    setTimeout(function() {
      typeWriter(text, i + 1);
    }, 50);
  }
}

function fireworks() {
  for(let i=0;i<35;i++){
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "heart";
    heart.style.left = Math.random()*100+"vw";
    heart.style.animationDuration = (Math.random()*4+3)+"s";
    document.body.appendChild(heart);
  }
}

</script>

</body>
</html>
