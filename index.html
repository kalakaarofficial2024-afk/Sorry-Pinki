<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Pinki 💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: radial-gradient(circle at top, #0b1026, #16213e, #000000);
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Stars Background */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.2; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1.2); }
        }

        .card {
            z-index: 10;
            text-align: center;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(255, 78, 136, 0.2);
            width: 320px;
        }

        h1 {
            color: #ff4e88;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff4e88;
        }

        .btn-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        #yesBtn {
            background: #ff4e88;
            color: white;
            box-shadow: 0 0 20px rgba(255, 78, 136, 0.5);
        }

        #noBtn {
            background: #444;
            color: white;
            position: fixed; /* Pure screen par kahin bhi bhagega */
            z-index: 999;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            color: #ffb6c1;
            line-height: 1.5;
            white-space: pre-line;
        }

        .emoji {
            position: absolute;
            pointer-events: none;
            animation: fly 4s linear forwards;
        }

        @keyframes fly {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h1 id="title">Sorry Pinki 💖</h1>
        <p id="sub">Kya tumne mujhe maaf kiya?</p>
        
        <div class="btn-container">
            <button id="yesBtn" onclick="accepted()">Yes 💕</button>
            <button id="noBtn" onmouseover="moveNo()" onclick="moveNo()">No 😏</button>
        </div>
        <div id="message"></div>
    </div>

    <div id="musicBox"></div>

    <script>
        // Generate stars
        for (let i = 0; i < 100; i++) {
            let star = document.createElement("div");
            star.className = "star";
            star.style.width = star.style.height = Math.random() * 3 + "px";
            star.style.left = Math.random() * 100 + "vw";
            star.style.top = Math.random() * 100 + "vh";
            document.body.appendChild(star);
        }

        // NO button movement logic
        function moveNo() {
            const btn = document.getElementById("noBtn");
            // Screen boundaries minus button size
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 40) + 20;
            
            btn.style.left = x + "px";
            btn.style.top = y + "px";
        }

        // YES button logic
        function accepted() {
            // 1. Play Song (YouTube Embed with Autoplay)
            const musicBox = document.getElementById("musicBox");
            musicBox.innerHTML = `<iframe width="0" height="0" src="https://www.youtube.com/embed/5r5mW0XvFJ8?autoplay=1" frameborder="0" allow="autoplay"></iframe>`;

            // 2. Hide Buttons and change UI
            document.getElementById("yesBtn").style.display = "none";
            document.getElementById("noBtn").style.display = "none";
            document.getElementById("sub").style.display = "none";
            document.getElementById("title").innerHTML = "I Knew It! 🥰";

            // 3. Type Message
            const msg = "Pinki...\nTum meri life ka sabse haseen hissa ho.\nSorry for everything! ❤️\nAb smile karo! 😊";
            let i = 0;
            const target = document.getElementById("message");
            
            function type() {
                if (i < msg.length) {
                    target.innerHTML += msg.charAt(i);
                    i++;
                    setTimeout(type, 50);
                }
            }
            type();

            // 4. Start celebration emojis
            setInterval(celebrate, 300);
        }

        function celebrate() {
            const e = document.createElement("div");
            const list = ["💖", "🌸", "✨", "💕", "🎀"];
            e.className = "emoji";
            e.innerHTML = list[Math.floor(Math.random() * list.length)];
            e.style.left = Math.random() * 100 + "vw";
            e.style.fontSize = Math.random() * 20 + 20 + "px";
            document.body.appendChild(e);
            setTimeout(() => e.remove(), 4000);
        }
    </script>
</body>
</html>
