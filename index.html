<!DOCTYPE html>
<html>
<head>
<title>Sorry Pinki 💖</title>

<style>
body {
  margin: 0;
  text-align: center;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #0b1026, #16213e, #000000);
  overflow: hidden;
  color: white;
  transition: 1s;
}

/* Stars */
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.5;
  animation: twinkle 2s infinite alternate;
}
@keyframes twinkle {
  from {opacity: 0.2;}
  to {opacity: 1;}
}

h1 {
  font-size: 50px;
  margin-top: 60px;
  color: #ff4e88;
}

/* Glow Text */
.glow {
  text-shadow: 0 0 10px #ff4e88,
               0 0 20px #ff4e88,
               0 0 40px #ff1493;
  animation: glowPulse 2s infinite alternate;
}
@keyframes glowPulse {
  from { text-shadow: 0 0 10px #ff4e88; }
  to { text-shadow: 0 0 30px #ff1493; }
}

button {
  padding: 15px 30px;
  font-size: 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin: 10px;
}

#yesBtn {
  background: #ff4e88;
  color: white;
}

#noBtn {
  background: #555;
  color: white;
  position: absolute;
}

#letter {
  display: none;
  margin-top: 30px;
  font-size: 22px;
  animation: fadeIn 2s;
  color: #ffb6c1;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

.heart {
  position: absolute;
  color: #ff4e88;
  font-size: 25px;
  animation: float 5s linear infinite;
}

@keyframes float {
  from {transform: translateY(100vh);}
  to {transform: translateY(-10vh);}
}
</style>
</head>

<body>

<h1>Sorry <span class="glow">Pinki 💖</span></h1>
<h2>Kya tum mujhe maaf karogi? 🥺</h2>

<button id="yesBtn" onclick="accept()">Yes 💖</button>
<button id="noBtn" onmouseover="moveButton()">No 😏</button>

<div id="letter">
💌 Pinki,
<br><br>
Main officially duniya ka sabse bada bewakoof hoon 😭  
Please mujhe maaf kar do 💖  
Main promise karta hoon dobara galti nahi hogi 🥺  
Love you infinity ♾️
</div>

<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>

// ⭐ Create Stars
for(let i=0;i<120;i++){
  let star=document.createElement("div");
  star.className="star";
  star.style.width=star.style.height=Math.random()*2+"px";
  star.style.top=Math.random()*100+"vh";
  star.style.left=Math.random()*100+"vw";
  document.body.appendChild(star);
}

// Initial No button position
window.onload=function(){
  const btn=document.getElementById("noBtn");
  btn.style.top="70%";
  btn.style.left="55%";
}

function accept() {

  // Background change effect
  document.body.style.background =
  "radial-gradient(circle, #2c003e, #000000)";

  document.getElementById("letter").style.display="block";
  document.getElementById("bgMusic").play();

  fireworks();
}

function moveButton() {
  var btn = document.getElementById("noBtn");

  const maxX = window.innerWidth - btn.offsetWidth - 20;
  const maxY = window.innerHeight - btn.offsetHeight - 20;

  btn.style.top = Math.random()*maxY + "px";
  btn.style.left = Math.random()*maxX + "px";
}

function fireworks() {
  for(let i=0;i<40;i++){
    let heart=document.createElement("div");
    heart.innerHTML="💖";
    heart.className="heart";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(heart);
  }
}

</script>

</body>
</html>
