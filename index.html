<!DOCTYPE html>
<html>
<head>
<title>Sorry Pinki 💖</title>

<style>
body {
  text-align: center;
  font-family: Arial;
  background: linear-gradient(to right, #ff9a9e, #fad0c4);
  overflow: hidden;
}

h1 {
  font-size: 50px;
  margin-top: 50px;
}

button {
  padding: 15px 30px;
  font-size: 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin: 10px;
}

#yesBtn {
  background: green;
  color: white;
}

#noBtn {
  background: red;
  color: white;
  position: absolute;
}

#letter {
  display: none;
  margin-top: 20px;
  font-size: 22px;
  animation: fadeIn 2s;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

.heart {
  position: absolute;
  color: red;
  font-size: 25px;
  animation: float 5s linear infinite;
}

@keyframes float {
  from {transform: translateY(100vh);}
  to {transform: translateY(-10vh);}
}
</style>
</head>

<body>

<h1>Sorry Pinki 💖</h1>
<h2>Kya tum mujhe maaf karogi? 🥺</h2>

<button id="yesBtn" onclick="accept()">Yes 💖</button>
<button id="noBtn" onmouseover="moveButton()">No 😏</button>

<div id="letter">
💌 Pinki,
<br><br>
Main officially duniya ka sabse bada bewakoof hoon 😭  
Please mujhe maaf kar do 💖  
Main promise karta hoon dobara galti nahi hogi 🥺  
Love you infinity ♾️
</div>

<audio autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>

function accept() {
  document.getElementById("letter").style.display = "block";
  fireworks();
}

function moveButton() {
  var btn = document.getElementById("noBtn");
  btn.style.top = Math.random() * window.innerHeight + "px";
  btn.style.left = Math.random() * window.innerWidth + "px";
}

function fireworks() {
  for(let i=0;i<50;i++){
    let heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.className = "heart";
    heart.style.left = Math.random()*100+"vw";
    heart.style.animationDuration = (Math.random()*3+2)+"s";
    document.body.appendChild(heart);
  }
}

</script>

</body>
</html>
