<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Pinki 💖</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #0b1026, #16213e, #000000);
    color: white;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

/* Stars */
.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.5;
    animation: twinkle 2s infinite alternate;
}
@keyframes twinkle { from {opacity: 0.2;} to {opacity: 1;} }

.container {
    z-index: 10;
    width: 90%;
    max-width: 500px;
    padding: 20px;
}

h1 {
    font-size: clamp(30px, 8vw, 50px);
    color: #ff4e88;
    text-shadow: 0 0 15px rgba(255, 78, 136, 0.6);
}

h2 {
    font-size: clamp(18px, 5vw, 24px);
    margin-bottom: 30px;
}

.btn-wrapper {
    position: relative;
    height: 250px;
}

button {
    padding: 15px 35px;
    font-size: 18px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

#yesBtn {
    background: #ff4e88;
    color: white;
    z-index: 100;
}

#noBtn {
    background: #555;
    color: white;
    position: absolute;
    z-index: 99;
    transition: left 0.2s ease, top 0.2s ease;
}

#message {
    margin-top: 20px;
    font-size: clamp(18px, 4vw, 24px);
    line-height: 1.6;
    color: #ffb6c1;
    white-space: pre-line;
}

.heart {
    position: absolute;
    pointer-events: none;
    animation: floatUp 4s linear forwards;
}
@keyframes floatUp {
    0% { transform: translateY(110vh) scale(0); opacity: 1; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
}
</style>
</head>

<body>

<div class="container">
    <div id="setup">
        <h1>Sorry Pinki 💖</h1>
        <h2>Kya tum mujhe maaf karogi? 🥺</h2>
        <div class="btn-wrapper">
            <button id="yesBtn" onclick="startLove()">Yes 💕</button>
            <button id="noBtn" onmouseover="moveAndGrow()" ontouchstart="moveAndGrow()">No 😏</button>
        </div>
    </div>
    <div id="message"></div>
</div>

<div id="ytContainer"></div>

<script>

// ⭐ Create Stars
for(let i=0; i<100; i++){
    let star = document.createElement("div");
    star.className = "star";
    star.style.width = star.style.height = Math.random()*2+"px";
    star.style.top = Math.random()*100+"vh";
    star.style.left = Math.random()*100+"vw";
    document.body.appendChild(star);
}

// Set initial No button position
window.onload = function() {
    const btn = document.getElementById("noBtn");
    btn.style.left = "60%";
    btn.style.top = "60%";
};

let scale = 1;
const yesBtn = document.getElementById("yesBtn");

function moveAndGrow() {

    // Grow Yes button
    scale += 0.3;
    yesBtn.style.transform = `scale(${scale})`;

    // Move No button inside screen
    const btn = document.getElementById("noBtn");

    const maxX = window.innerWidth - btn.offsetWidth - 20;
    const maxY = window.innerHeight - btn.offsetHeight - 20;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    btn.style.left = x + "px";
    btn.style.top = y + "px";
}

function startLove() {

    // Play Song (Safe Method)
    const videoId = "5r5mW0XvFJ8";
    document.getElementById("ytContainer").innerHTML = `
    <iframe 
        src="https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}&controls=0"
        allow="autoplay"
        style="position:absolute;width:1px;height:1px;border:0;">
    </iframe>`;

    document.getElementById("setup").style.display = "none";

    let text = "Pinki...\n\nTum meri life ka sabse beautiful part ho 💕\nMain dil se sorry hoon 🥺\nPlease mujhe maaf kar do ❤️\n\nForever yours 💖";
    typeWriter(text, 0);
    setInterval(createHeart, 300);
}

function typeWriter(text, i) {
    const target = document.getElementById("message");
    if (i < text.length) {
        target.innerHTML += text.charAt(i);
        setTimeout(() => typeWriter(text, i + 1), 50);
    }
}

function createHeart() {
    let heart = document.createElement("div");
    const emojis = ["💖","💗","💕","✨"];
    heart.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];
    heart.className = "heart";
    heart.style.left = Math.random()*100+"vw";
    heart.style.fontSize = Math.random()*15+20+"px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
}

</script>

</body>
</html>
